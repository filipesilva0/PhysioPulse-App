# PhysioPulse on ZimaOS. The installer puts this folder in /DATA/AppData/physiopulse and runs `docker compose up -d`.
# Phase 3: the API is published on this server's own address (BIND_IP, default all addresses) for Nginx Proxy Manager,
# which gives it HTTPS at the clinic's public address (PUBLIC_URL). The router forwards only 443 (and 80 for the
# certificate) to NPM — never SERVER_PORT. Every device needs the owner's approval (server/src/routes/devices.rs).
name: physiopulse
services:
  server:
    build: .
    restart: unless-stopped
    environment:
      BIND: 0.0.0.0:8080
      ARCHIVE_DIR: /data/PhysioPulse
      DATABASE_URL: postgres://physiopulse:${POSTGRES_PASSWORD}@db:5432/physiopulse
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}  # set in .env for Ollama on another clinic machine (LAN or Tailscale 100.x); the server refuses public addresses
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:12b}  # pull it once: docker compose exec ollama ollama pull gemma3:12b
      WHISPER_URL: ${WHISPER_URL:-}   # speech-to-text (whisper-server on the AI PC, e.g. http://192.168.1.66:8178); the owner can set it in the app
      AUDIO_DIR: /data/audio
      IDLE_MINUTES: ${IDLE_MINUTES:-15}
      PUBLIC_ADDRESS: ${PUBLIC_URL:-}   # the clinic's HTTPS address, shown in Settings › Server and backups
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is missing in .env - run the installer again}"   # encrypts the two-step secrets (never in backups)
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32,::1/128,172.16.0.0/12}   # who may say the real client address (Nginx Proxy Manager in Docker)
      BACKUP_CONTROL: /backup-control
      PORTAL_DB_PASSWORD: ${PORTAL_DB_PASSWORD:-}   # the website's own database login (set on start-up; empty = the website can't sign in)
      SITE_URL: ${SITE_URL:-}                       # the public website's address, shown in Settings › Website
    volumes:
      - ${DATA_DIR}/archive:/data/PhysioPulse
      - ${DATA_DIR}/backup-control:/backup-control      # backup status in, "Back Up Now" requests out (never the backups)
      - ${DATA_DIR}/audio:/data/audio                   # session recordings — NOT mounted in the backup container, on purpose
    ports:
      - "${BIND_IP:-0.0.0.0}:${SERVER_PORT:-8080}:8080"   # SERVER_PORT in .env if 8080 is taken; never forward it on the router
    depends_on:
      db: { condition: service_healthy }

  # Phase 4a: the public website. Its own container and its own database login (physiopulse_portal), which can
  # read only the website's views and add appointment requests — never patient files, staff or money. No volumes.
  site:
    build: ./portal
    restart: unless-stopped
    environment:
      BIND: 0.0.0.0:8090
      DATABASE_URL: postgres://physiopulse_portal:${PORTAL_DB_PASSWORD:-}@db:5432/physiopulse
      FORM_KEY: ${FORM_KEY:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32,::1/128,172.16.0.0/12}
    ports:
      - "${BIND_IP:-0.0.0.0}:${SITE_PORT:-8096}:8090"   # Nginx Proxy Manager → physiopulse.duckdns.org; never forward it on the router
    depends_on:
      server: { condition: service_started }

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: physiopulse
      POSTGRES_USER: physiopulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${DATA_DIR}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U physiopulse"]
      interval: 5s
      retries: 20
    # no ports: only the server container reaches the database

  backup:
    build: ./backup
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://physiopulse:${POSTGRES_PASSWORD}@db:5432/physiopulse
      AGE_RECIPIENT: ${AGE_RECIPIENT}
      BACKUP_HOUR: "03"
      KEEP_DAYS: "30"
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      BACKUP_CONTROL: /backup-control
    volumes:
      - ${DATA_DIR}/archive:/data/PhysioPulse:ro
      - ${BACKUP_DIR}:/backups
      - ${DATA_DIR}/backup-control:/backup-control
    depends_on:
      db: { condition: service_healthy }

  ollama:
    image: ollama/ollama:latest   # pin to the version you install, e.g. ollama/ollama:0.x.y
    profiles: ["ai"]              # not started until phase 4: `docker compose --profile ai up -d`
    restart: unless-stopped
    volumes:
      - ${DATA_DIR}/ollama:/root/.ollama
    # no ports: only the server talks to the AI (used from phase 4)

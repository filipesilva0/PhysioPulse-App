[package]
name = "physiopulse-server"
version = "0.24.0"
edition = "2021"
rust-version = "1.85"
description = "PhysioPulse server: runs on ZimaOS, reached through the clinic's HTTPS address (device approval)"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "derive", "json"] }
argon2 = "0.5"
totp-rs = { version = "5", features = ["otpauth", "gen_secret"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "limit", "set-header"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
base64 = "0.22"
png = "0.17"
flate2 = "1"
lopdf = { version = "0.42", default-features = false }
chacha20poly1305 = "0.10"
